name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies & Setup Android
      run: |
        npm install
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android
        mkdir -p www
        if [ ! -f www/index.html ]; then
          echo "<!DOCTYPE html><html><head><title>App</title></head><body></body></html>" > www/index.html
        fi
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Bypass Gradle Jar Cache Conflict
      run: |
        cd android
        # Disable offline jar transforms that cause the bouncy castle locking bug
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "org.gradle.parallel=false" >> gradle.properties
        echo "org.gradle.caching=false" >> gradle.properties

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
