name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Add Capacitor Android and Sync
      run: |
        npm install @capacitor/cli @capacitor/core @capacitor/android
        mkdir -p www
        if [ ! -f www/index.html ]; then
          echo "<!DOCTYPE html><html><head><title>App</title></head><body></body></html>" > www/index.html
        fi
        npx cap add android
        npx cap sync android

    - name: Fix Gradle Build Config
      run: |
        cd android
        # Disable strict jar caching transforms that trigger the crash
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
        echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
