name: Android CI

on:
  push:
    branches: [ main, master, feat/android-background-audio ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@^5

      - name: Add Android platform (if missing)
        run: |
          # npx cap add android will create android/ if missing
          npx cap add android || echo "android platform already added or creation failed"

      - name: Copy plugin sources into Android project
        run: |
          bash scripts/install-android-plugin.sh || echo "install-android-plugin.sh completed with warnings"

      - name: Add ExoPlayer dependency if missing
        run: |
          if [ -f android/app/build.gradle ]; then
            if ! grep -q "com.google.android.exoplayer:exoplayer" android/app/build.gradle; then
              echo "Adding ExoPlayer dependency to android/app/build.gradle"
              awk '/dependencies \{/ { print; print "    implementation \"com.google.android.exoplayer:exoplayer:2.20.0\""; next }1' android/app/build.gradle > /tmp/build.gradle && mv /tmp/build.gradle android/app/build.gradle
            else
              echo "ExoPlayer already present"
            fi
          else
            echo "android/app/build.gradle not found; skipping ExoPlayer injection"
          fi

      - name: Inject service into AndroidManifest if missing
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "AudioPlaybackService" "$MANIFEST"; then
              echo "Injecting service into AndroidManifest"
              awk '/<application/ { print; print "        <service android:name=\"com.nac.choir.audio.AudioPlaybackService\" android:exported=\"false\" android:foregroundServiceType=\"mediaPlayback\"/>"; next }1' "$MANIFEST" > /tmp/AndroidManifest.xml && mv /tmp/AndroidManifest.xml "$MANIFEST"
            else
              echo "Service already present in manifest"
            fi
          else
            echo "AndroidManifest not found; skipping manifest injection"
          fi

      - name: Sync Capacitor and Android
        run: |
          npx cap sync android || echo "npx cap sync android finished with warnings"

      - name: Install Android SDK components (if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -o sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip
          unzip -q sdk-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Accept licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Debug - list repo root and android dir
        run: |
          echo "Repo root:"
          ls -la
          echo "android dir listing (if exists):"
          ls -la android || true

      - name: Build Android release (safe: checks for android/ and gradlew)
        run: |
          if [ ! -d android ]; then
            echo "Error: android/ directory does not exist. Aborting build step."
            exit 1
          fi

          cd android

          if [ -f ./gradlew ]; then
            echo "Using project gradle wrapper (./gradlew)"
            chmod +x ./gradlew || true
            ./gradlew assembleRelease -Porg.gradle.daemon=false
          else
            echo "./gradlew not found. Installing system Gradle and attempting to build (may be slower)."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle assembleRelease -Porg.gradle.daemon=false
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/app/build/outputs/**
          
